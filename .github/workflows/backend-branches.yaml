name: Backend build and test
run-name: Build and test backend application on branches

on:
  push:
    branches-ignore:
      - main
    paths:
      - backend/**

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies (dev)
        run: uv pip install -e .[dev]

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check .

      - name: Run tests
        run: uv run pytest