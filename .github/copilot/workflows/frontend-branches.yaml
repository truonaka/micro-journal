name: Frontend build and test
run-name: Build and test frontend application on branches

on:
  push:
    branches-ignore:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: |
          echo "REACT_APP_API_URL=http://127.0.0.1:8801" > .env
          echo "PORT=3301" >> .env

      - name: Build frontend
        run: npm run build

      - name: Run unit tests
        run: npm test -- --watchAll=false