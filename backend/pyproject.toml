[project]
name = "micro-journal-backend"
version = "0.1.0"
description = "Micro Journal backend using FastAPI, Pydantic, SQLite"
requires-python = ">=3.10"
authors = [
    { name = "Tummeli Ruonakoski Kallio" }
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ty",
    "httpx"
]

[tool.ruff]
line-length = 79
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]